                <div class="lg:col-span-7 flex flex-col gap-3">
                  {['Integer', 'String', 'Boolean', 'Array / List'].map((option, idx) => (
                    <button 
                      key={idx} 
                      onClick={() => handleSelect(idx)}
                      class={`w-full p-4 rounded-xl text-left shadow-sm flex items-center justify-between transition-all ${selected === idx ? 'bg-primary-container/20 border-2 border-primary text-primary font-bold' : 'bg-surface-container-lowest hover:bg-surface-container-low text-on-surface'}`}
                    >
                      <div class="flex items-center gap-3">
                        <span class="w-8 h-8 rounded-lg bg-surface-container flex items-center justify-center">{String.fromCharCode(65 + idx)}</span>
                        <span>{option}</span>
                      </div>
                      {selected === idx && <span class="material-symbols-outlined text-primary">check_circle</span>}
                    </button>
                  ))}
                </div>
              </div>

              {/* Bottom Result Notification */}
              {isCorrect && (
                <div class="w-full bg-primary text-on-primary rounded-xl p-6 shadow-xl flex flex-col md:flex-row items-center justify-between gap-4">
                  <div>
                    <h3 class="font-headline-md">Nicely done! That's a String (str).</h3>

                  </div>
                  <button 
                    onClick={() => navigate('/lesson-complete')} 
                    class="px-8 py-3 bg-surface-container-lowest text-primary font-bold rounded-xl shadow uppercase tracking-wider"
                  >
                    Continue
                  </button>
                </div>
              )}
            </div>
          </main>
        </div>
      );
    }
